<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>レシートOCR家計簿</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 12px;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 16px;
    color: #333;
  }

  .card {
    background: #fff;
    padding: 16px;
    margin-bottom: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .card h2 {
    font-size: 18px;
    margin-bottom: 12px;
    color: #444;
  }

  button {
    width: 100%;
    padding: 14px;
    margin: 6px 0;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    background: #1976d2;
    color: #fff;
    font-weight: bold;
  }

  button.secondary {
    background: #555;
  }

  button.danger {
    background: #d32f2f;
  }

  input, textarea {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin: 6px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }

  video, canvas {
    width: 100%;
    border-radius: 10px;
    margin-top: 8px;
  }

  pre {
    background: #f7f7f7;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    white-space: pre-wrap;
  }

  details summary {
    cursor: pointer;
    font-size: 15px;
    padding: 6px 0;
    color: #1976d2;
  }

  #editor {
    background: #fff;
    padding: 16px;
    border-radius: 12px;
    margin-top: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  /* iOS風オーバーレイカード */
  #overlayCard {
    position: fixed;
    left: 0;
    bottom: -400px; /* 初期は画面外 */
    width: 100%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
    padding: 16px 16px 24px;
    box-sizing: border-box;
    transition: bottom 0.35s ease-out;
    max-height: 60vh;
    overflow-y: auto;
    z-index: 9999;
  }

  #overlayHandle {
    width: 40px;
    height: 4px;
    border-radius: 999px;
    background: rgba(0,0,0,0.2);
    margin: 0 auto 8px;
  }

  .candidate-card h3 {
    margin-top: 0;
    font-size: 16px;
    margin-bottom: 8px;
  }

  .candidate-card p {
    margin: 4px 0;
    font-size: 14px;
  }

  .candidate-card button {
    margin-top: 12px;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

</head>
<body>

<h1>📸 レシートOCR家計簿</h1>

<div class="card">
  <h2>① APIキー設定</h2>
  <input type="password" id="apiKeyInput" placeholder="Google Vision APIキーを入力">
  <button id="setApiKey">APIキーを設定</button>
</div>

<div class="card">
  <h2>② カメラ撮影</h2>
  <button id="start">カメラ起動</button>
  <button id="capture">撮影してOCR</button>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>
</div>

<div class="card">
  <h2>③ ファイルから読み込む</h2>
  <input type="file" id="fileInput" accept=".jpg,.jpeg,.png">
  <button id="loadFile" class="secondary">画像ファイルをOCR</button>
</div>

<div class="card">
  <h2>④ OCR結果（最終JSON）</h2>
  <pre id="output"></pre>
</div>

<div class="card">
  <h2>⑤ 高度な操作</h2>
  <button id="reparse" class="secondary">rawTextから再解析</button>
  <button id="openEditor" class="secondary">手入力で補正</button>
  <button id="downloadExcel" class="secondary">Excel家計簿をダウンロード</button>
  <button id="downloadZip" class="secondary">ZIP（写真＋rawText＋parsed）</button>
</div>

<div class="card">
  <h2>⑥ 履歴管理</h2>
  <button id="saveHistory">このレシートを履歴に保存</button>
  <button id="showHistory" class="secondary">履歴を表示</button>
  <div id="history"></div>
</div>

<div id="editor" style="display:none;">
  <h2>レシート編集</h2>
  <label>日付:<input id="editDate"></label>
  <label>時間:<input id="editTime"></label>
  <label>店名:<input id="editShop"></label>
  <label>合計金額:<input id="editTotal" type="number"></label>
  <label>消費税率:<input id="editTaxRate"></label>
  <label>消費税額:<input id="editTaxAmount" type="number"></label>
  <label>支払い方法:<input id="editPayment"></label>
  <label>明細(JSON):</label>
  <textarea id="editItems" style="height:120px;"></textarea>

  <button id="saveEdit" class="secondary">編集内容を反映</button>
  <button id="closeEditor" class="danger">閉じる</button>
</div>

<!-- iOS風オーバーレイ候補カード -->
<div id="overlayCard">
  <div id="overlayHandle"></div>
  <div id="candidateContainer"></div>
</div>

<script src="app.js"></script>
</body>
</html>
