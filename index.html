<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>レシートOCR</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Cropper.js（標準UI） -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 12px;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 16px;
    color: #333;
  }

  .card {
    background: #fff;
    padding: 16px;
    margin-bottom: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .card h2 {
    font-size: 18px;
    margin-bottom: 12px;
    color: #444;
  }

  button {
    width: 100%;
    padding: 14px;
    margin: 6px 0;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    background: #1976d2;
    color: #fff;
    font-weight: bold;
  }

  button.secondary {
    background: #555;
  }

  button.danger {
    background: #d32f2f;
  }

  input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin: 6px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }

  video, canvas {
    width: 100%;
    border-radius: 10px;
    margin-top: 8px;
  }

  /* 撮影後のプレビュー（全画面） */
  #previewArea {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 9998;
    overflow: hidden;
  }

  #previewImage {
    max-width: 100%;
    max-height: 100%;
    display: block;
    margin: auto;
  }

  #previewButtons {
    position: fixed;
    bottom: 20px;
    width: 100%;
    display: flex;
    gap: 10px;
    padding: 0 20px;
    box-sizing: border-box;
  }

  #previewButtons button {
    flex: 1;
    padding: 14px;
    font-size: 16px;
  }

  /* 履歴 */
  .history-item {
    margin-bottom: 16px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fff;
  }

  .history-item img {
    width: 100%;
    max-width: 320px;
    border-radius: 6px;
    display: block;
    margin-top: 4px;
  }

  .history-item pre {
    background: #f7f7f7;
    border-radius: 8px;
    padding: 8px;
    font-size: 12px;
    white-space: pre-wrap;
  }

  /* 編集ボトムシート（ドラッグ可変） */
  #editOverlay {
    position: fixed;
    left: 0;
    bottom: -80vh;
    width: 100%;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
    padding: 12px 16px 16px;
    box-sizing: border-box;
    transition: bottom 0.25s ease-out;
    max-height: 80vh;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    touch-action: none;
  }

  #editHandle {
    width: 40px;
    height: 4px;
    border-radius: 999px;
    background: rgba(0,0,0,0.2);
    margin: 0 auto 8px;
  }

  #editTitle {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
    text-align: center;
  }

  #editText {
    flex: 1;
    width: 100%;
    border-radius: 8px;
    border: 1px solid #ccc;
    padding: 8px;
    font-size: 14px;
    resize: none;
    box-sizing: border-box;
    white-space: pre-wrap;
  }

  #editButtons {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  #editButtons button {
    flex: 1;
    font-size: 15px;
    padding: 10px;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

</head>
<body>

<h1>レシートOCR</h1>

<div class="card">
  <h2>① APIキー設定</h2>
  <input type="password" id="apiKeyInput" placeholder="Google Vision APIキーを入力">
  <button id="setApiKey">APIキーを設定</button>
</div>

<div class="card">
  <h2>② カメラ撮影</h2>
  <button id="start">カメラ起動</button>
  <button id="capture">撮影してOCR</button>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>

<div style="position:relative;">
  <video id="video" autoplay playsinline></video>

  <div id="zoomArea" style="
    position:absolute;
    right:8px;
    top:8px;
    bottom:8px;
    display:none;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
  ">
    <div id="zoomLabel" style="
      background:rgba(0,0,0,0.6);
      color:#fff;
      padding:4px 8px;
      border-radius:6px;
      font-size:12px;
      margin-bottom:6px;
    ">1.2x</div>

    <input id="zoomSlider" type="range" min="1" max="5" step="0.1" value="1.2"
      style="
        writing-mode: bt-lr;
        -webkit-appearance: slider-vertical;
        appearance: slider-vertical;
        width: 30px;
        height: 160px;
      ">
  </div>
</div>

</div>
<div class="card">
  <h2>③ ファイルから読み込む</h2>
  <input type="file" id="fileInput" accept=".jpg,.jpeg,.png">
  <button id="loadFile" class="secondary">画像ファイルをOCR</button>
</div>

<div class="card">
  <h2>④ 履歴管理</h2>
  <button id="showHistory" class="secondary">履歴を表示</button>
  <button id="downloadZip" class="secondary">ZIP（写真＋OCR全文）をダウンロード</button>
  <div id="history"></div>
</div>

<!-- 撮影後プレビュー（全画面） -->
<div id="previewArea">
  <img id="previewImage">
  <div id="previewButtons">
    <button id="doCrop" style="background:#1976d2;color:#fff;">OCRする</button>
    <button id="cancelPreview" class="danger">キャンセル</button>
  </div>
</div>

<!-- OCR全文編集用ボトムシート -->
<div id="editOverlay">
  <div id="editHandle"></div>
  <div id="editTitle">OCR結果を確認・修正</div>
  <textarea id="editText"></textarea>
  <div id="editButtons">
    <button id="confirmEdit" style="background:#1976d2;color:#fff;">確定して履歴に保存</button>
    <button id="cancelEdit" class="danger">キャンセル</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
