<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>レシートOCR家計簿（スマホ対応）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 10px; }
    h1 { font-size: 22px; }
    h3 { margin-top: 20px; font-size: 18px; }
    video, canvas { width: 100%; max-width: 420px; border-radius: 8px; }
    button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      font-size: 18px;
      border-radius: 6px;
      border: none;
      background: #1976d2;
      color: #fff;
    }
    button.secondary {
      background: #555;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      margin: 5px 0;
      box-sizing: border-box;
    }
    #output, #history {
      white-space: pre-wrap;
      margin-top: 10px;
      font-size: 13px;
      background: #f5f5f5;
      padding: 8px;
      border-radius: 6px;
      max-height: 260px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<h1>📸 レシートOCR家計簿（スマホ対応）</h1>

<h3>① APIキーを入力（初回のみ）</h3>
<input type="password" id="apiKeyInput" placeholder="Google Vision APIキーを入力">
<button id="setApiKey">APIキーを設定</button>

<h3>② カメラ</h3>
<button id="start">カメラ起動</button>
<button id="capture">撮影してOCR</button>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<h3>③ 抽出結果（1枚のレシート）</h3>
<pre id="output"></pre>

<h3>④ 履歴管理</h3>
<button id="saveHistory" class="secondary">このレシートを履歴に追加</button>
<button id="showHistory" class="secondary">履歴一覧を表示</button>
<button id="downloadExcel" class="secondary">履歴をExcel家計簿としてダウンロード</button>

<pre id="history"></pre>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
