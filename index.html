<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>レシートOCR（スマホ対応）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 10px; }
    video, canvas { width: 100%; max-width: 400px; }
    button { padding: 10px; margin: 5px 0; width: 100%; font-size: 18px; }
    input { width: 100%; padding: 10px; font-size: 18px; margin: 5px 0; }
    #output { white-space: pre-wrap; margin-top: 20px; }
  </style>
</head>
<body>

<h1>📸 レシートOCR（スマホ対応）</h1>

<h3>① APIキーを入力（初回のみ）</h3>
<input type="password" id="apiKeyInput" placeholder="Google Vision APIキーを入力">
<button id="setApiKey">APIキーを設定</button>

<h3>② カメラ操作</h3>
<button id="start">カメラ起動</button>
<button id="capture">撮影してOCR</button>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<h2>③ 抽出結果</h2>
<pre id="output"></pre>

<h3>④ 履歴管理</h3>
<button id="saveHistory">履歴に保存</button>
<button id="showHistory">履歴を見る</button>

<pre id="history"></pre>

<script src="app.js"></script>
</body>
</html>
